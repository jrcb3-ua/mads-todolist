<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head (titulo)">
    <meta charset="UTF-8"/>
    <title th:text="${titulo}"></title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<div th:fragment="javascript">
    <script th:src="@{/js/jquery.min.js}"></script>
    <script th:src="@{/js/popper.min.js}"></script>
    <script th:src="@{/js/bootstrap.min.js}"></script>
</div>

<nav class="navbar navbar-expand-lg navbar-light bg-light" th:fragment="navbar">
    <a class="navbar-brand" th:href="@{/about}">ToDoList</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#mainNavbar"
            aria-controls="mainNavbar" aria-expanded="false" aria-label="Mostrar navegación">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav mr-auto" th:if="${usuarioMenu != null}">
            <li class="nav-item">
                <a class="nav-link" th:href="@{/usuarios/{id}/tareas(id=${usuarioMenu.id})}">Tareas</a>
            </li>
        </ul>
        <ul class="navbar-nav ml-auto" th:if="${usuarioMenu != null}">
            <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" id="usuarioMenuDropdown" role="button"
                   data-toggle="dropdown" aria-haspopup="true" aria-expanded="false"
                   th:text="${usuarioMenu.nombre != null ? usuarioMenu.nombre : usuarioMenu.email}">Usuario</a>
                <div class="dropdown-menu dropdown-menu-right" aria-labelledby="usuarioMenuDropdown">
                    <a class="dropdown-item" href="#">Cuenta</a>
                    <a class="dropdown-item" th:href="@{/logout}"
                       th:text="'Cerrar sesión ' + (${usuarioMenu.nombre != null ? usuarioMenu.nombre : usuarioMenu.email})">
                        Cerrar sesión
                    </a>
                </div>
            </li>
        </ul>
        <ul class="navbar-nav ml-auto" th:if="${usuarioMenu == null}">
            <li class="nav-item">
                <a class="nav-link" th:href="@{/login}">Iniciar sesión</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/registro}">Registro</a>
            </li>
        </ul>
    </div>
</nav>

</html>
