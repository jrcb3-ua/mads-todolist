<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Usuarios registrados')"></head>

<body>
<div th:replace="fragments :: navbar"></div>
<main class="container-fluid mt-3">
    <h2>Usuarios registrados</h2>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>Identificador</th>
            <th>Correo electrónico</th>
            <th>Estado</th>
            <th>Acción</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="usuario : ${usuarios}">
            <td>
                <a th:href="@{/registrados/{id}(id=${usuario.id})}" th:text="${usuario.id}"></a>
            </td>
            <td th:text="${usuario.email}"></td>
            <td th:text="${usuario.bloqueado ? 'Bloqueado' : 'Activo'}"></td>
            <td>
                <form method="post" th:if="${usuario.id != usuarioMenu.id}"
                      th:action="@{/registrados/{id}/bloqueo(id=${usuario.id})}">
                    <button class="btn btn-sm" type="submit"
                            th:classappend="${usuario.bloqueado ? 'btn-success' : 'btn-warning'}"
                            th:text="${usuario.bloqueado ? 'Habilitar' : 'Bloquear'}">
                        Bloquear
                    </button>
                </form>
                <span th:if="${usuario.id == usuarioMenu.id}">Administrador actual</span>
            </td>
        </tr>
        </tbody>
    </table>
</main>

<div th:replace="fragments :: javascript"></div>
</body>
</html>
