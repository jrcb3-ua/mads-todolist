<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Listado de equipos')"></head>

<body>
<div th:replace="fragments :: navbar"></div>
<main class="container-fluid mt-3">
    <div class="row">
        <div class="col">
            <h2>Listado de equipos</h2>
            <div class="alert alert-success" th:if="${mensaje != null}" th:text="${mensaje}"></div>
            <p th:if="${usuarioMenu != null}">
                <a class="btn btn-success" th:href="@{/equipos/nuevo}">Nuevo equipo</a>
            </p>
        </div>
    </div>

    <div class="row mt-3">
        <div class="col">
            <table class="table table-striped" th:if="${equipos != null && !equipos.isEmpty()}">
                <thead>
                <tr>
                    <th>Identificador</th>
                    <th>Nombre</th>
                    <th>Acción</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="equipo : ${equipos}">
                    <td th:text="${equipo.id}"></td>
                    <td>
                        <a th:href="@{/equipos/{id}(id=${equipo.id})}" th:text="${equipo.nombre}"></a>
                    </td>
                    <td>
                        <a class="btn btn-primary btn-sm" th:href="@{/equipos/{id}(id=${equipo.id})}">Ver miembros</a>
                    </td>
                </tr>
                </tbody>
            </table>
            <p th:if="${equipos == null || equipos.isEmpty()}">No hay equipos registrados actualmente.</p>
        </div>
    </div>
</main>

<div th:replace="fragments :: javascript"></div>
</body>
</html>
