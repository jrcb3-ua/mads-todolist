<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Detalle de equipo')"></head>

<body>
<div th:replace="fragments :: navbar"></div>
<main class="container-fluid mt-3">
    <div class="row">
        <div class="col">
            <h2 th:text="'Equipo: ' + ${equipo.nombre}"></h2>
        </div>
    </div>

    <div class="row mt-3">
        <div class="col">
            <h4>Participantes</h4>
            <table class="table table-striped" th:if="${usuarios != null && !usuarios.isEmpty()}">
                <thead>
                <tr>
                    <th>Identificador</th>
                    <th>Nombre</th>
                    <th>Correo electrónico</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="usuario : ${usuarios}">
                    <td th:text="${usuario.id}"></td>
                    <td th:text="${usuario.nombre != null ? usuario.nombre : '-'}"></td>
                    <td th:text="${usuario.email}"></td>
                </tr>
                </tbody>
            </table>
            <p th:if="${usuarios == null || usuarios.isEmpty()}">Este equipo no tiene participantes asignados.</p>
            <p>
                <a class="btn btn-secondary" th:href="@{/equipos}">Volver al listado</a>
            </p>
        </div>
    </div>
</main>

<div th:replace="fragments :: javascript"></div>
</body>
</html>
